name: Build cluster binaries
#
# Builds mnist_distributed for both machine types actually used in the
# StakMesh cluster (Linux and Windows/MinGW), with -march=native turned OFF
# (STAKMESH_NATIVE_ARCH=OFF - see CMakeLists.txt) so the resulting binaries
# run on any x86_64 machine, not just the one that compiled them.
#
# Goal: adding/refreshing a node should be "download the right binary from
# the latest run" instead of "clone the repo and build it there".
#
# Each artifact holds TWO binaries: mnist_distributed (the real training job)
# and stakmesh_smoke (no-dataset check that a cluster is wired up correctly;
# run it first on a new node/network: see README "Testing on one machine").

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTAKMESH_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build -j

      # Sanity check: if the build is broken, don't ship a broken binary.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mnist_distributed-linux-x86_64
          path: |
            build/mnist_distributed
            build/stakmesh_smoke
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MSYS2/MinGW-w64 UCRT64, not MSVC - matches the toolchain the Windows
      # cluster machine actually builds with locally (see README/CMakeLists
      # comments on MinGW vs MSVC flag differences).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openmp
            mingw-w64-ucrt-x86_64-ninja

      # StakML's CPU backend needs OpenMP (find_package(OpenMP REQUIRED)). The GCC
      # package alone no longer guarantees libgomp is installed: with it missing,
      # FindOpenMP fails with "missing: OpenMP_CXX_FLAGS OpenMP_CXX_LIB_NAMES"
      # whatever flags are passed, hence the explicit mingw-w64-*-openmp above.
      # This step just prints what the runner actually has, to make any future
      # toolchain change obvious from the log.
      - name: Show toolchain
        run: |
          gcc --version | head -1
          echo "libgomp.a      -> $(gcc -print-file-name=libgomp.a)"
          echo "libgomp.dll.a  -> $(gcc -print-file-name=libgomp.dll.a)"
          ls -1 "$(dirname "$(command -v gcc)")"/libgomp* || echo "no libgomp DLL next to gcc"

      # Two passes: pass 1 is a stock configure, so compiler/OpenMP feature checks
      # run with default flags; pass 2 only adds -static, which affects the final
      # link (pulls libstdc++/libgcc/winpthread into the exes). Pass 2 reuses the
      # cached OpenMP result. (An earlier commit claimed static linking but never
      # actually passed any static flag.)
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTAKMESH_NATIVE_ARCH=OFF
          cmake -S . -B build -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The binaries get copied to machines WITHOUT MSYS2, so a missing-DLL
      # dependency would only show up later as a silent "won't start".
      #  - libstdc++/libgcc must be static (that's what -static is for): fail if not.
      #  - OpenMP (libgomp) stays a DLL (FindOpenMP links its import library), so
      #    ship libgomp-1.dll and the libwinpthread-1.dll it needs next to the exes.
      - name: Check runtime DLL dependencies and bundle OpenMP
        run: |
          BIN_DIR="$(dirname "$(command -v gcc)")"
          NEED_GOMP=0
          for exe in build/mnist_distributed.exe build/stakmesh_smoke.exe; do
            echo "== $exe imports:"
            objdump -p "$exe" | grep "DLL Name" | sort -u
            if objdump -p "$exe" | grep -Ei "libstdc|libgcc"; then
              echo "::error::$exe still depends on the MSYS2 C++ runtime (static link failed)"
              exit 1
            fi
            if objdump -p "$exe" | grep -qi "libgomp"; then NEED_GOMP=1; fi
          done
          if [ "$NEED_GOMP" = 1 ]; then
            # Copy libgomp and everything it imports that lives next to gcc
            # (winpthread, libgcc_s, ...). Windows system DLLs aren't in that
            # directory, so they are skipped automatically.
            bundle() {
              local dll="$1"
              [ -f "build/$dll" ] && return 0
              [ -f "$BIN_DIR/$dll" ] || return 0
              cp -v "$BIN_DIR/$dll" build/
              for dep in $(objdump -p "$BIN_DIR/$dll" | awk '/DLL Name/{print $3}'); do
                bundle "$dep"
              done
            }
            bundle libgomp-1.dll
            echo "== files shipped next to the exes:"
            ls -1 build/*.dll
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mnist_distributed-windows-x86_64
          path: |
            build/mnist_distributed.exe
            build/stakmesh_smoke.exe
            build/*.dll
          if-no-files-found: error

  # Only runs when a GitHub Release is created (e.g. `git tag vX && git push
  # --tags` then create a release from it): attaches both binaries to it, so
  # "grab the latest release" is a stable target instead of hunting through
  # workflow run artifacts.
  attach-to-release:
    if: github.event_name == 'release'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mnist_distributed-linux-x86_64/mnist_distributed
            artifacts/mnist_distributed-linux-x86_64/stakmesh_smoke
            artifacts/mnist_distributed-windows-x86_64/mnist_distributed.exe
            artifacts/mnist_distributed-windows-x86_64/stakmesh_smoke.exe
            artifacts/mnist_distributed-windows-x86_64/*.dll